name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run pytest
        run: pytest -v

  pipeline:
    name: End-to-end pipeline (stages 1-3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Stage 1 - data engineering
        run: |
          python code/datasets/download_data.py
          python code/datasets/prepare_data.py
      - name: Stage 2 - model engineering
        run: |
          python code/models/train.py
          python code/models/validate_model.py
      - name: Stage 3 - build and run the containers
        run: docker compose -p pmldl-deployment -f code/deployment/docker-compose.yml up -d --build --wait --wait-timeout 300
      - name: Smoke test the deployment
        run: bash code/deployment/smoke_test.sh
      - name: Container logs on failure
        if: failure()
        run: docker compose -p pmldl-deployment -f code/deployment/docker-compose.yml logs
      - name: Tear down
        if: always()
        run: docker compose -p pmldl-deployment -f code/deployment/docker-compose.yml down -v
